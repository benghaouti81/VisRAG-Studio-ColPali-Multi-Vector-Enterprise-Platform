version: '3.8'

services:
  # Python FastAPI ColPali & VisRAG Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visrag-colpali-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEVICE=${DEVICE:-cpu}
      - USE_QDRANT=true
      - QDRANT_URL=http://qdrant:6333
      - PORT=8000
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app
      - backend_cache:/root/.cache
    # For NVIDIA GPU passthrough (optional on CUDA hosts)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # React Frontend Service (Production Nginx/Node)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: visrag-colpali-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  # Qdrant Vector Store with Multi-Vector Late Interaction Support
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: visrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    driver: local
  backend_cache:
    driver: local
